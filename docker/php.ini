; Ollama can take minutes to answer (OLLAMA_TIMEOUT=180), so allow long requests.
max_execution_time = 300
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Code only changes on rebuild, so skip checking files for changes.
opcache.validate_timestamps = 0
